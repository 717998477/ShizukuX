name: Build ShizukuX APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (with submodules + full history)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0          # versionCode uses `git rev-list --count HEAD`
          lfs: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: true

      - name: Install platform / build-tools / NDK / CMake
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Set up Rust + Android targets + cargo-ndk
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          cargo install cargo-ndk --locked
          cargo ndk --version

      - name: Generate release keystore + signing.properties
        run: |
          keytool -genkeypair -noprompt -v \
            -keystore "$GITHUB_WORKSPACE/ci-release.keystore" \
            -storepass shizukuxci -keypass shizukuxci \
            -alias shizukux -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=ShizukuX CI, O=Self Build, C=CN"
          printf '%s\n' \
            "KEYSTORE_FILE=$GITHUB_WORKSPACE/ci-release.keystore" \
            'KEYSTORE_PASSWORD=shizukuxci' \
            'KEYSTORE_ALIAS=shizukux' \
            'KEYSTORE_ALIAS_PASSWORD=shizukuxci' > signing.properties
          cat signing.properties
          ls -l "$GITHUB_WORKSPACE/ci-release.keystore"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build ShizukuX (standard + Drop-In)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            :manager:assembleShizukuxRelease \
            :manager:assembleDropinRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          for f in $(find manager/build/outputs/apk -name "*.apk" -type f); do
            name=$(basename "$f")
            cp "$f" "out/$name"
          done
          ls -l out
          sha256sum out/*.apk | tee out/SHA256SUMS.txt
          # 方便直接装：打印每个包的包名（aapt2 不在 PATH 时静默跳过）
          AAPT2="$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt2"
          for f in out/*.apk; do
            [ -x "$AAPT2" ] && echo "$f -> $("$AAPT2" dump badging "$f" 2>/dev/null | head -1)" || true
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ShizukuX-legacyadb-${{ github.run_number }}
          path: out/*
          retention-days: 90
          if-no-files-found: error
